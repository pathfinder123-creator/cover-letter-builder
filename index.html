<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cover Letter Builder & Job-Match Coach</title>
<style>
  :root{
    --ink:#1E2A3D;
    --collin-blue:#0C2E82;
    --paper:#FAFAF7;
    --panel:#FFFFFF;
    --kraft:#C9A66B;
    --kraft-dark:#A9803F;
    --teal:#2C6E63;
    --teal-dark:#1E4F47;
    --slate:#57626F;
    --slate-light:#8C95A1;
    --line:#DEDAD0;
    --amber:#B8752E;
    --amber-bg:#FBF1E3;
    --green:#3F7D58;
    --green-bg:#EAF3ED;
    --red:#B3452C;
    --red-bg:#FBEAE4;
    --radius:6px;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  body{-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  input, textarea{font-family:inherit;}
  a{color:inherit;}

  /* ---------- Header ---------- */
  header.top{
    background:var(--collin-blue);
    color:var(--paper);
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    border-bottom:3px solid var(--kraft);
  }
  header.top .brand{display:flex;align-items:center;gap:14px;}
  header.top .brand img{height:44px;width:auto;display:block;background:#fff;border-radius:4px;padding:4px 8px;}
  header.top .title-block h1{
    font-family:var(--serif);
    font-size:1.25rem;
    margin:0 0 2px 0;
    font-weight:700;
    letter-spacing:0.01em;
  }
  header.top .title-block p{
    margin:0;
    font-size:0.78rem;
    color:#C9D3EA;
    font-family:var(--mono);
    letter-spacing:0.03em;
  }
  header.top .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .btn{
    border:1px solid transparent;
    border-radius:var(--radius);
    padding:9px 14px;
    font-size:0.85rem;
    font-weight:600;
    transition:transform .04s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-ghost{background:transparent;color:var(--paper);border-color:#4A5468;}
  .btn-ghost:hover{border-color:var(--kraft);}
  .btn-outline{background:#fff;color:var(--ink);border-color:var(--line);}
  .btn-outline:hover{border-color:var(--slate);}
  .btn-small{padding:5px 10px;font-size:0.75rem;}
  .btn-remove{background:none;border:none;color:var(--red);font-size:0.78rem;font-weight:600;text-decoration:underline;padding:2px 0;}

  /* ---------- Layout ---------- */
  .app{display:grid;grid-template-columns:210px minmax(320px,1fr) 380px;min-height:calc(100vh - 66px);}
  @media (max-width:1080px){
    .app{grid-template-columns:1fr;}
    .rail{display:flex;overflow-x:auto;padding:10px 18px 10px 12px;gap:7px;border-right:0;border-bottom:1px solid var(--line);scroll-padding-inline:12px;-webkit-overflow-scrolling:touch;overscroll-behavior-inline:contain;}
    .rail .tab{width:auto;max-width:calc(100vw - 42px);min-height:44px;flex:0 0 auto;border:1px solid var(--line);border-left:1px solid var(--line);border-radius:999px;background:#fff;padding:8px 11px;font-size:.78rem;gap:6px;white-space:nowrap;scroll-snap-align:start;}
    .rail .tab.active{border:2px solid var(--kraft-dark);background:#FFFDF9;padding:7px 10px;}
    .rail .tab .opt{display:none;}
    .rail .tab .dot{width:7px;height:7px;}
    .preview-col{border-top:6px solid var(--kraft);}
  }

  /* ---------- Tab rail ---------- */
  .rail{background:#F1EEE6;padding:20px 0;border-right:1px solid var(--line);}
  .tab{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    background:transparent;border:none;border-left:4px solid transparent;
    padding:11px 14px;font-size:0.83rem;color:var(--slate);font-weight:600;
  }
  .tab .dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:0 0 auto;}
  .tab.complete .dot{background:var(--teal);}
  .tab.active{background:var(--panel);color:var(--ink);border-left-color:var(--kraft-dark);}
  .tab .opt{font-family:var(--mono);font-size:0.62rem;color:var(--slate-light);font-weight:400;margin-left:auto;}

  /* ---------- Form column ---------- */
  .form-col{padding:28px 30px;background:var(--panel);overflow-y:auto;}
  .section-head{margin-bottom:18px;}
  .section-head h2{font-family:var(--serif);font-size:1.3rem;margin:0 0 4px 0;}
  .section-head .guide{
    font-size:0.85rem;color:var(--slate);background:var(--amber-bg);
    border-left:3px solid var(--kraft-dark);padding:9px 12px;
    border-radius:0 var(--radius) var(--radius) 0;margin-top:8px;
  }
  label{display:block;font-size:0.78rem;font-weight:700;color:var(--slate);margin-bottom:5px;letter-spacing:0.01em;}
  label.full{margin-top:14px;}
  .hint{font-weight:400;font-size:0.78rem;color:var(--slate-light);margin-bottom:6px;font-style:italic;}
  input[type=text], input[type=email], input[type=tel], textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);
    font-size:0.92rem;color:var(--ink);background:#fff;margin-bottom:14px;
  }
  input:focus, textarea:focus, button:focus, .tab:focus{outline:2px solid var(--teal);outline-offset:1px;}
  textarea{resize:vertical;min-height:70px;line-height:1.45;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:600px){.field-row{grid-template-columns:1fr;}}
  .entry-card{border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px;background:#FDFCFA;position:relative;}
  .entry-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .entry-num{font-family:var(--mono);font-size:0.72rem;color:var(--kraft-dark);font-weight:700;letter-spacing:0.04em;}
  .add-btn{background:#fff;border:1.5px dashed var(--slate-light);color:var(--slate);border-radius:var(--radius);padding:10px;width:100%;font-size:0.85rem;font-weight:600;}
  .add-btn:hover{border-color:var(--teal);color:var(--teal-dark);}
  .coach-feedback{margin-top:6px;font-size:0.78rem;}
  .flag{display:flex;gap:7px;align-items:flex-start;padding:6px 8px;border-radius:5px;margin-bottom:5px;line-height:1.4;}
  .flag.amber{background:var(--amber-bg);color:#7A4D1D;}
  .flag.red{background:var(--red-bg);color:#7C3018;}
  .flag.green{background:var(--green-bg);color:#265239;}
  .flag b{font-family:var(--mono);font-size:0.7rem;text-transform:uppercase;margin-right:2px;}
  .tags-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .chip{display:inline-block;padding:4px 10px;border-radius:999px;font-size:0.78rem;border:1px solid var(--line);}
  .chip.matched{background:var(--green-bg);color:#265239;border-color:#BFE0CC;}
  .chip.missing{background:var(--amber-bg);color:#7A4D1D;border-color:#EAD3A6;}
  .toggle-row{display:flex;align-items:center;gap:8px;margin:4px 0 12px 0;font-size:0.8rem;color:var(--slate);}
  .toggle-row input{margin:0;width:auto;}

  /* ---------- Preview column ---------- */
  .preview-col{background:#EFECE3;padding:26px 22px;overflow-y:auto;border-left:1px solid var(--line);}
  .preview-label{font-family:var(--mono);font-size:0.72rem;color:var(--slate);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
  .paper{
    background:#fff;box-shadow:0 2px 14px rgba(30,42,61,0.14);padding:0.65in 0.6in;min-height:9in;
    font-family:Aptos, Arial, Helvetica, sans-serif;font-size:11pt;color:#111;line-height:1.5;
  }
  .r-name{text-align:center;font-size:19pt;font-weight:700;margin:0 0 2px 0;}
  .r-contact{text-align:center;font-size:9.5pt;margin:0 0 6px 0;color:#222;padding-bottom:8px;border-bottom:1.5pt solid #2C6E63;}
  .r-date-table{width:100%;border-collapse:collapse;margin:18px 0 14px 0;font-size:11pt;}
  .r-date-table td.r-date-cell{text-align:right;padding:0;}
  .r-recipient{font-size:11pt;margin:0 0 14px 0;}
  .r-recipient div{margin:0;}
  .r-p{margin:0 0 12px 0;font-size:11pt;}
  .r-empty{color:#9AA1AA;font-style:italic;}
  .r-sig-gap{height:0.5in;}

  .save-status{font-size:0.72rem;color:var(--slate);font-family:var(--mono);}
  .review-block{margin-bottom:22px;}
  .review-block h3{font-family:var(--serif);font-size:1.05rem;margin:0 0 8px 0;}
  .count-pill{display:inline-flex;align-items:center;gap:6px;background:#F1EEE6;border-radius:999px;padding:4px 12px;font-size:0.8rem;margin-right:8px;margin-bottom:6px;}
  .footer-note{font-size:0.78rem;color:var(--slate);margin-top:6px;}
  input[type=file]{display:none;}


  /* ---------- Optional AI polish ---------- */
  .ai-polish{margin-top:12px;border:1px solid #C8D8EF;border-radius:8px;background:#F6F9FF;padding:12px;}
  .ai-polish-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .ai-polish-title{font-size:0.82rem;font-weight:800;color:var(--collin-blue);}
  .ai-polish-note{font-size:0.76rem;color:var(--slate);margin-top:3px;line-height:1.4;}
  .ai-result{display:none;margin-top:10px;}
  .ai-result.show{display:block;}
  .ai-output{border:1px solid #CFD9E8;background:#fff;border-radius:7px;padding:11px;font-size:0.88rem;line-height:1.5;white-space:pre-wrap;}
  .ai-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;}
  .ai-status{margin-top:7px;font-size:0.76rem;color:var(--slate);}


  /* ---------- Mobile guided workflow ---------- */
  .mobile-workflow-bar,.mobile-preview{display:none;}
  @media (max-width:760px){
    body{padding-bottom:76px;}
    header.top{padding:10px 12px;gap:9px;}
    header.top .brand{gap:9px;min-width:0;align-items:center;}
    header.top .brand img{height:34px;padding:3px 6px;}
    header.top .title-block{min-width:0;}
    header.top .title-block h1{font-size:1rem;line-height:1.15;}
    header.top .title-block p{display:none;}
    header.top .actions{width:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin;}
    header.top .actions .btn{flex:0 0 auto;white-space:nowrap;padding:7px 10px;font-size:.74rem;}

    .app{display:block;min-height:auto;}
    .rail{position:sticky;top:0;z-index:20;display:flex;overflow-x:auto;padding:8px 10px;gap:7px;border-right:0;border-bottom:1px solid var(--line);background:#F1EEE6;box-shadow:0 2px 8px rgba(30,42,61,.08);scrollbar-width:none;}
    .rail::-webkit-scrollbar{display:none;}
    .rail .tab{width:auto;flex:0 0 auto;border:1px solid var(--line);border-left:1px solid var(--line);border-radius:999px;background:#fff;padding:8px 11px;font-size:.76rem;gap:6px;white-space:nowrap;}
    .rail .tab.active{border:2px solid var(--kraft-dark);background:#FFFDF9;padding:7px 10px;}
    .rail .tab .opt{display:none;}
    .rail .tab .dot{width:7px;height:7px;}

    .form-col{padding:20px 14px 24px;overflow:visible;}
    .section-head{margin-bottom:14px;}
    .section-head h2{font-size:1.2rem;}
    .section-head .guide{font-size:.8rem;}
    input[type=text],input[type=email],input[type=tel],textarea{font-size:16px;padding:11px 12px;margin-bottom:13px;}
    textarea{min-height:92px;}
    .entry-card{padding:14px 12px;margin-bottom:14px;}
    .btn{min-height:42px;}
    .btn-small{min-height:38px;padding:8px 11px;}
    .add-btn{min-height:46px;}
    .ai-polish{padding:12px 10px;}
    .ai-polish-head{align-items:stretch;}
    .ai-polish-head .btn{width:100%;}
    .ai-actions{display:grid;grid-template-columns:1fr;}
    .ai-actions .btn{width:100%;}

    .preview-col{display:none;}
    .mobile-workflow-bar{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:9px 10px calc(9px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(30,42,61,.12);}
    .mobile-workflow-bar button{min-height:46px;border-radius:8px;font-size:.78rem;font-weight:700;}
    .mobile-workflow-bar .mobile-prev{text-align:left;}
    .mobile-workflow-bar .mobile-next{text-align:right;}
    .mobile-workflow-bar .mobile-preview-btn{padding-left:12px;padding-right:12px;}
    .mobile-workflow-bar button:disabled{opacity:.4;cursor:not-allowed;}

    .mobile-preview{position:fixed;inset:0;z-index:100;background:#EAE7DE;overflow:auto;padding:0 0 28px;}
    .mobile-preview.open{display:block;}
    .mobile-preview-head{position:sticky;top:0;z-index:2;background:var(--collin-blue);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-bottom:3px solid var(--kraft);}
    .mobile-preview-head strong{font-family:var(--serif);font-size:1rem;}
    .mobile-preview-head button{background:#fff;color:var(--collin-blue);border:0;border-radius:6px;padding:8px 11px;font-weight:700;}
    .mobile-preview .paper{margin:14px 10px 0;padding:24px 20px;min-height:0;box-shadow:0 2px 12px rgba(30,42,61,.16);font-size:9.7pt;}
    .mobile-preview .r-name{font-size:17pt;}
    .mobile-preview .r-p,.mobile-preview .r-recipient,.mobile-preview .r-date-table{font-size:10pt;}
    body.preview-open{overflow:hidden;}
  }

  @page{size:letter;margin:0.75in;}
  @media print{
    header.top,.rail,.form-col,.preview-label,.save-status{display:none !important;}
    .app{display:block;}
    .preview-col{background:#fff;padding:0;border:none;}
    .paper{box-shadow:none;padding:0;min-height:0;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    
    <div class="title-block">
      <h1>Cover Letter Builder &amp; Job-Match Coach</h1>
      <p id="collegeTag">BUILD YOUR LETTER · KEEP YOUR OWN VOICE</p>
    </div>
  </div>
  <div class="actions">
    <button class="btn btn-ghost btn-small" onclick="document.getElementById('loadFileInput').click()">Load saved file</button>
    <input type="file" id="loadFileInput" accept="application/json" onchange="loadProgressFile(this)">
    <button class="btn btn-ghost btn-small" onclick="saveProgressFile()">Save backup file</button>
    <button class="btn btn-outline btn-small" onclick="printLetter()">Print / Save PDF</button>
    <button class="btn btn-primary" onclick="downloadWord()">Download Word Letter</button>
  </div>
</header>

<div class="app">
  <nav class="rail" id="rail"></nav>
  <main class="form-col" id="formPanel"></main>
  <aside class="preview-col">
    <div class="preview-label">
      <span>Live preview</span>
      <span class="save-status" id="saveStatus">—</span>
    </div>
    <div class="paper" id="previewPanel"></div>
  </aside>
</div>

<div class="mobile-workflow-bar" id="mobileWorkflowBar" aria-label="Cover letter section navigation">
  <button type="button" class="btn btn-outline mobile-prev" id="mobilePrevBtn" onclick="mobileStep(-1)">← Previous</button>
  <button type="button" class="btn btn-outline mobile-preview-btn" onclick="openMobilePreview()">Preview</button>
  <button type="button" class="btn btn-primary mobile-next" id="mobileNextBtn" onclick="mobileStep(1)">Save &amp; Continue →</button>
</div>
<div class="mobile-preview" id="mobilePreview" role="dialog" aria-modal="true" aria-labelledby="mobilePreviewTitle">
  <div class="mobile-preview-head">
    <strong id="mobilePreviewTitle">Cover Letter Preview</strong>
    <button type="button" onclick="closeMobilePreview()">Back to Editing</button>
  </div>
  <div class="paper" id="mobilePreviewPanel"></div>
</div>

<script>
/* =====================================================================
   GUIDING LANGUAGE (from the college's approved cover letter template)
   ===================================================================== */
const GUIDING = {
  experience: "Highlight work experience and accomplishments that relate directly to the position. Avoid casual language and exclamation marks — your reader is looking for a clear match between your qualifications and the job's specific requirements. The main purpose of this paragraph is to earn interest in your resume.",
  industry: "Show your knowledge of the field and any additional experience or qualifications that make you a good candidate. Mentioning a specific challenge or need in this industry or at this company can show a deeper understanding of the role, the culture, and the market it serves.",
  opening: "This opener is built from recommended wording and the position/company you entered in the previous section. You can add an optional referral line, or fully rewrite it if you prefer.",
  closing: "This closing is also built from recommended wording. Fill in what the company provides so it reads specifically, not generically.",
};

const AI_CLICHES = ["spearheaded","leverage","leveraged","leveraging","synergy","synergies","utilize","utilizing","utilized","in order to","passionate about","results-driven","results driven","dynamic team player","proven track record","seamlessly","robust solution","cutting-edge","game-changer","game changer","ensure smooth","dive into","delve into","furthermore","moreover","holistic approach","paradigm shift","unlock","elevate","elevating","empower","empowering","foster","fostering","streamline","streamlined solution","bespoke","tailored solution","world-class","best-in-class","strategic vision","thought leader","circle back","touch base","low-hanging fruit"];

const CLICHE_SWAP = {
  "spearheaded":"led","spearheading":"leading","spearhead":"lead",
  "leverage":"use","leverages":"uses","leveraged":"used","leveraging":"using",
  "utilize":"use","utilizes":"uses","utilizing":"using","utilized":"used",
  "passionate about":"focused on","results-driven":"reliable and outcome-focused","results driven":"reliable and outcome-focused",
  "dynamic team player":"collaborative team member","proven track record":"consistent record",
  "seamlessly":"smoothly","seamless":"smooth","cutting-edge":"current","game-changer":"major improvement","game changer":"major improvement",
  "streamlined solution":"simplified approach","streamline":"simplify","streamlines":"simplifies","streamlined":"simplified",
  "holistic approach":"complete approach","unlock":"support","unlocks":"supports","elevate":"improve","elevates":"improves","elevating":"improving",
  "empower":"support","empowers":"supports","empowering":"supporting","foster":"build","fosters":"builds","fostering":"building",
  "bespoke":"custom","tailored solution":"custom approach","world-class":"high-quality","best-in-class":"top-tier",
  "strategic vision":"clear plan","thought leader":"experienced voice","in order to":"to","robust solution":"strong approach"
};

const CASUAL_WORDS = ["gonna","wanna","gotta","kinda","sorta","yeah","awesome","cool","super excited","really really","a lot of","totally","basically"];

const STOPWORDS = new Set("a about above after again against all am an and any are aren't as at be because been before being below between both but by can't cannot could couldn't did didn't do does doesn't doing don't down during each few for from further had hadn't has hasn't have haven't having he he'd he'll he's her here here's hers herself him himself his how how's i i'd i'll i'm i've if in into is isn't it it's its itself let's me more most mustn't my myself no nor not of off on once only or other ought our ours ourselves out over own same shan't she she'd she'll she's should shouldn't so some such than that that's the their theirs them themselves then there there's these they they'd they'll they're they've this those through to too under until up very was wasn't we we'd we'll we're we've were weren't what what's when when's where where's which while who who's whom why why's with won't would wouldn't you you'd you'll you're you've your yours yourself yourselves job role position candidate applicant company team work experience years including must able using strong ability etc please note preferred required equivalent related plus".split(" "));

/* =====================================================================
   STATE
   ===================================================================== */
let state = {
  activeTab: "contact",
  contact: { name:"", cityState:"", phone:"", email:"", linkedin:"" },
  recipient: {
    companyName:"", hiringManagerName:"", department:"Human Resources",
    positionTitle:"", postingCode:"", dateStr:"", referralSource:"", companyDescriptor:""
  },
  openingOverride: null,
  experience: "",
  industry: "",
  closingOverride: null,
  credentials: "",
  jobPosting: ""
};

function todayFormatted(){
  const d = new Date();
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  return months[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
}

/* =====================================================================
   PERSISTENCE
   ===================================================================== */
const STORAGE_KEY = "coverLetterBuilderDraft_v1";
const AI_POLISH_ENDPOINT = window.CAREER_TOOLS_AI_ENDPOINT || "https://pitch-builder.daniels75040.workers.dev/polish";
function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    document.getElementById('saveStatus').textContent = "Saved to this browser at " + new Date().toLocaleTimeString();
  }catch(err){
    document.getElementById('saveStatus').textContent = "Could not autosave (private/incognito mode?) — use 'Save backup file' instead.";
  }
}
function loadFromStorage(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign({}, state, parsed);
      state.recipient = Object.assign({companyName:"",hiringManagerName:"",department:"Human Resources",positionTitle:"",postingCode:"",dateStr:"",referralSource:"",companyDescriptor:""}, state.recipient||{});
      return true;
    }
  }catch(err){}
  return false;
}
function saveProgressFile(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const nm = (state.contact.name || "cover_letter").trim().replace(/\s+/g,'_');
  a.download = nm + "_cover_letter_progress.json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function loadProgressFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || typeof parsed !== "object"){
        alert("That doesn't look like a readable file.");
        return;

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function formatPhoneNumber(value){
  const raw=String(value||"").trim();
  const digits=raw.replace(/\D/g,"");
  if(digits.length!==10) return raw;
  if(raw.includes("-") && !raw.includes("(")) return digits.slice(0,3)+"-"+digits.slice(3,6)+"-"+digits.slice(6);
  return "("+digits.slice(0,3)+") "+digits.slice(3,6)+"-"+digits.slice(6);
}
function setPath(obj, path, value){
  const parts = path.split(".");
  let o = obj;
  for(let i=0;i<parts.length-1;i++){
    if(!(parts[i] in o) || typeof o[parts[i]] !== "object" || o[parts[i]]===null) o[parts[i]] = {};
    o = o[parts[i]];
  }
  o[parts[parts.length-1]] = value;
}
function splitSentences(text){
  if(!text) return [];
  const matches = text.match(/[^.!?]*[.!?]+|[^.!?]+$/g);
  return matches ? matches.map(s=>s.trim()).filter(Boolean) : [];
}
function wordCount(text){ return (text||"").trim().split(/\s+/).filter(Boolean).length; }

/* =====================================================================
   COACHING ANALYSIS (rule-based — nothing here is AI-generated text)
   ===================================================================== */
function analyzeParagraph(text, opts){
  opts = opts || {};
  const flags = [];
  if(!text || !text.trim()) return flags;
  if(/\[[^\]]{2,80}\]/.test(text)){
    flags.push({level:"red", tag:"PLACEHOLDER", msg:"Still has a [bracketed] placeholder in it — make sure every bracket has been replaced with real text before sending."});
  }
  if(/!/.test(text)){
    flags.push({level:"amber", tag:"TONE", msg:"Contains an exclamation mark — the program's guidance is to avoid these in a professional letter."});
  }
  const lower = text.toLowerCase();
  const foundCasual = CASUAL_WORDS.find(c => lower.includes(c));
  if(foundCasual){
    flags.push({level:"amber", tag:"TONE", msg:"Contains \""+foundCasual+"\" — reads as casual for a cover letter. Consider more formal phrasing."});
  }
  const foundCliche = AI_CLICHES.find(c => lower.includes(c));
  if(foundCliche){
    flags.push({level:"red", tag:"PHRASING", msg:"Contains \""+foundCliche+"\" — a phrase that often reads as generic or AI-sounding. Try describing it plainly in your own words."});
  }
  const wc = wordCount(text);
  if(opts.checkLength){
    if(wc > 0 && wc < 20){
      flags.push({level:"amber", tag:"LENGTH", msg:"Quite short ("+wc+" words) — consider adding a specific example or detail."});
    } else if(wc > 160){
      flags.push({level:"amber", tag:"LENGTH", msg:"Quite long ("+wc+" words) for one cover-letter paragraph — consider trimming to the most relevant points."});
    }
  }
  if(opts.checkQuantify && wc > 25 && !/[\d%$]/.test(text)){
    flags.push({level:"amber", tag:"NUMBER", msg:"No number yet — if you can measure an accomplishment (count, %, $, time), consider adding one."});
  }
  if(flags.length===0){
    flags.push({level:"green", tag:"OK", msg:"Reads clearly."});
  }
  return flags;
}
function renderFlagList(flags, emptyMsg){
  if(!flags || flags.length===0) return '<div class="flag green"><b>OK</b>'+esc(emptyMsg||"No notes here.")+'</div>';
  const capped = flags.slice(0,5);
  let html = capped.map(f => '<div class="flag '+f.level+'"><b>'+f.tag+'</b>'+esc(f.msg)+'</div>').join("");
  if(flags.length > 5) html += '<div class="footer-note">+'+(flags.length-5)+' more note(s).</div>';
  return html;
}

/* =====================================================================
   PARAGRAPH POLISH (rule-based clean pass, same approach as the Resume Builder)
   ===================================================================== */
function swapCliches(text){
  let out = text;
  Object.keys(CLICHE_SWAP).sort((a,b)=>b.length-a.length).forEach(k=>{
    const re = new RegExp("\\b"+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+"\\b","gi");
    out = out.replace(re, CLICHE_SWAP[k]);
  });
  return out;
}
function cleanParagraph(text){
  let out = (text||"").trim();
  out = swapCliches(out);
  out = out.replace(/!+/g, ".");
  CASUAL_WORDS.forEach(w=>{
    const re = new RegExp("\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+"\\b","gi");
    out = out.replace(re, "");
  });
  out = out.replace(/\s{2,}/g," ").replace(/\s+\./g,".").trim();
  if(out.length) out = out.charAt(0).toUpperCase() + out.slice(1);
  return out;
}

/* =====================================================================
   KEYWORD MATCHING (same approach as the Resume Builder)
   ===================================================================== */
function extractKeywords(jobText){
  if(!jobText || !jobText.trim()) return [];
  const capPhrases = {};
  const capRegex = /\b([A-Z][a-zA-Z+#]*(?:\s+[A-Z][a-zA-Z+#]*){0,2})\b/g;
  let m;
  while((m = capRegex.exec(jobText)) !== null){
    const phrase = m[1].trim();
    if(phrase.split(" ").length > 3) continue;
    const lowerWords = phrase.toLowerCase().split(" ");
    if(lowerWords.every(w => STOPWORDS.has(w))) continue;
    if(phrase.length < 3) continue;
    capPhrases[phrase] = (capPhrases[phrase]||0) + 1;
  }
  const words = jobText.toLowerCase().replace(/[^a-z0-9+#\s]/g," ").split(/\s+/).filter(Boolean);
  const freq = {};
  words.forEach(w => {
    if(w.length < 4 || STOPWORDS.has(w) || /^\d+$/.test(w)) return;
    freq[w] = (freq[w]||0) + 1;
  });
  const combined = {};
  Object.keys(capPhrases).forEach(k => combined[k] = (combined[k]||0) + capPhrases[k]*2);
  Object.keys(freq).forEach(k => combined[k] = (combined[k]||0) + freq[k]);
  return Object.entries(combined).sort((a,b)=> b[1]-a[1]).slice(0, 24).map(([term,count]) => ({term,count}));
}
function buildLetterText(){
  return [openingText(), state.experience, state.industry, closingText()].join(" ").toLowerCase();
}
function matchKeywords(){
  const kws = extractKeywords(state.jobPosting);
  const letterText = buildLetterText();
  const matched = [], missing = [];
  kws.forEach(k => {
    if(letterText.includes(k.term.toLowerCase())) matched.push(k.term);
    else missing.push(k.term);
  });
  return {matched: matched.slice(0,16), missing: missing.slice(0,16)};
}

    aiCoverText[fieldKey]=String(data.polished||'').trim();
    if(!aiCoverText[fieldKey]) throw new Error('The AI did not return a usable paragraph.');
    output.textContent=aiCoverText[fieldKey]; result.classList.add('show');
    status.textContent='Review the polished version. You decide whether to use it.';
  }catch(err){
    console.error('AI cover-letter polish error:',err);
    status.textContent='AI polishing is temporarily unavailable. Your original paragraph and local tools are unchanged.';
  }finally{ btn.disabled=false; btn.textContent='Polish with AI'; }
}
function useAICoverParagraph(fieldKey,prefix){
  if(!aiCoverText[fieldKey]) return;
  state[fieldKey]=aiCoverText[fieldKey]; persist(); renderFormPanel(); renderPreview(); renderRail();
}
function dismissAICoverParagraph(prefix){
  const fieldKey=prefix==='expAi'?'experience':'industry'; aiCoverText[fieldKey]='';
  const result=document.getElementById(prefix+'Result'); if(result) result.classList.remove('show');
  const status=document.getElementById(prefix+'Status'); if(status) status.textContent='Kept your original paragraph. No AI changes were applied.';
}

function renderExperienceTab(){
  return '<div class="section-head"><h2>Experience &amp; Accomplishments</h2><div class="guide">'+GUIDING.experience+'</div></div>'
    + '<label for="expField">Paragraph</label>'
    + '<textarea id="expField" data-path="experience" data-coach="experience" rows="8" placeholder="In my role at..., I...">'+esc(state.experience)+'</textarea>'
    + '<div class="coach-feedback" id="expField-feedback"></div>'
    + '<button type="button" class="btn btn-outline btn-small" style="margin-top:8px;" onclick="showParagraphPolish(\'experience\',\'expPolishPanel\')">Polish this paragraph</button>'
    + '<div id="expPolishPanel"></div>'
    + aiPolishPanelHTML('experience','expAi');
}
function renderIndustryTab(){
  return '<div class="section-head"><h2>Industry Knowledge &amp; Fit</h2><div class="guide">'+GUIDING.industry+'</div></div>'
    + '<label for="indField">Paragraph</label>'
    + '<textarea id="indField" data-path="industry" data-coach="industry" rows="8" placeholder="I understand that organizations like [Company] face...">'+esc(state.industry)+'</textarea>'
    + '<div class="coach-feedback" id="indField-feedback"></div>'
    + '<button type="button" class="btn btn-outline btn-small" style="margin-top:8px;" onclick="showParagraphPolish(\'industry\',\'indPolishPanel\')">Polish this paragraph</button>'
    + '<div id="indPolishPanel"></div>'
    + aiPolishPanelHTML('industry','indAi');
}

function renderJobTab(){
  return '<div class="section-head"><h2>Target Job</h2><div class="guide">Paste in the job posting text (not the URL). We\'ll compare likely keywords to your letter — nothing gets added automatically.</div></div>'
    + '<label for="jobText">Job posting text</label>'
    + '<textarea id="jobText" data-path="jobPosting" data-coach="job" rows="10" placeholder="Paste the full job description here...">'+esc(state.jobPosting)+'</textarea>'
    + '<div id="jobMatchArea">'+renderJobMatch(matchKeywords())+'</div>';
}
function renderJobMatch(r){
  if(!state.jobPosting.trim()) return '<p class="hint">Paste a job posting above to see a keyword comparison.</p>';
  let html = '<p style="font-size:0.85rem;color:var(--slate);margin-top:14px;"><b>Already in your letter:</b></p>';
  html += '<div class="tags-row">' + (r.matched.length? r.matched.map(t=>'<span class="chip matched">'+esc(t)+'</span>').join(""): '<span class="hint">No overlap found yet.</span>') + '</div>';
  html += '<p style="font-size:0.85rem;color:var(--slate);margin-top:14px;"><b>In the posting, not yet in your letter:</b></p>';
  html += '<div class="tags-row">' + (r.missing.length? r.missing.map(t=>'<span class="chip missing">'+esc(t)+'</span>').join(""): '<span class="hint">Nothing obvious missing.</span>') + '</div>';
  html += '<p class="footer-note">Only mention a term if it\'s honestly true of your experience.</p>';
  return html;
}

function collectAllFlags(){
  const totals = {red:0, amber:0};
  const tally = (flags)=>{ flags.forEach(f=>{ if(f.level==="red") totals.red++; else if(f.level==="amber") totals.amber++; }); };
  tally(analyzeParagraph(state.experience, {checkLength:true, checkQuantify:true}));
  tally(analyzeParagraph(state.industry, {checkLength:true}));
  if(state.openingOverride !== null) tally(analyzeParagraph(state.openingOverride, {checkLength:true}));
  if(state.closingOverride !== null) tally(analyzeParagraph(state.closingOverride, {checkLength:true}));
  return totals;
}
function renderReviewTab(){
  const totals = collectAllFlags();
  const r = matchKeywords();
  let html = '<div class="section-head"><h2>Review &amp; Export</h2></div>';

  html += '<div class="review-block"><h3>Language check</h3>';
  html += '<span class="count-pill">🟠 '+totals.amber+' tone/length note(s)</span>';
  html += '<span class="count-pill">🔴 '+totals.red+' placeholder/phrasing note(s)</span>';
  html += '<p class="footer-note">Head back to Experience &amp; Fit or Industry Knowledge to see specific notes. A red flag often means a leftover [bracket] placeholder — always double-check before sending.</p></div>';

  html += '<div class="review-block"><h3>Job-match keywords</h3>';
  if(state.jobPosting.trim()){
    html += '<div class="tags-row">'+ r.matched.slice(0,10).map(t=>'<span class="chip matched">'+esc(t)+'</span>').join("") +'</div>';
    html += '<p class="footer-note">'+r.missing.length+' term(s) from the posting aren\'t reflected yet — see the Target Job tab.</p>';
  } else {
    html += '<p class="hint">Add a job posting on the Target Job tab to see a match report.</p>';
  }
  html += '</div>';

  html += '<div class="review-block"><h3>Export</h3>'
    + '<button class="btn btn-primary" onclick="downloadWord()">Download Word Letter (.doc)</button> '
    + '<button class="btn btn-outline" onclick="printLetter()">Print / Save as PDF</button>'
    + '<p class="footer-note">The Word file opens directly in Microsoft Word or Google Docs. In Word, use "Save As" → .docx to convert it to the standard editable format.</p>'
    + '<p class="footer-note">For PDF: choose Save as PDF, open More settings, turn off Headers and footers, and leave Margins at Default. The tool requests 0.75-inch margins; check the print preview before saving.</p>'
    + '</div>';

  html += '<div class="review-block"><h3>Your data</h3>'
    + '<button class="btn btn-outline btn-small" onclick="saveProgressFile()">Save a backup file</button> '
    + '<button class="btn btn-outline btn-small" onclick="document.getElementById(\'loadFileInput\').click()">Load a backup file</button> '
    + '<button class="btn btn-outline btn-small" onclick="clearData()" style="color:var(--red);border-color:var(--red);">Clear my data</button>'
    + '<p class="footer-note">Your letter data stays in your browser unless you choose “Polish with AI.” When you do, only that selected body paragraph and a short list of locally extracted target-job terms are sent to the AI service for that request. On a shared or lab computer, save a backup file so you can pick this up later.</p>'
    + '</div>';

  return html;
}

/* =====================================================================
   PARAGRAPH POLISH PANEL
   ===================================================================== */
function showParagraphPolish(fieldKey, panelId){
  const panel = document.getElementById(panelId);
  if(!panel) return;
  const text = state[fieldKey] || "";
  if(!text.trim()){
    panel.innerHTML = '<p class="hint" style="margin-top:8px;">Write a draft paragraph above first — this works from what you\'ve already written.</p>';
    return;
  }
  const cleaned = cleanParagraph(text);
  const flags = analyzeParagraph(cleaned, {checkLength:true, checkQuantify: fieldKey==="experience"});
  let html = '<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px;">';
  html += '<p class="footer-note" style="margin-bottom:10px;">Built from your own words — clichés swapped for plain language, exclamation marks and casual phrases removed. Nothing here is AI-generated; review the grammar before using it.</p>';
  html += '<div class="entry-card" style="background:#fff;">'
    + '<div class="entry-head"><span class="entry-num">CLEANED VERSION</span>'
    + '<button type="button" class="btn btn-primary btn-small" onclick="useCleanedParagraph(\''+fieldKey+'\',\''+panelId+'\')">Use this version</button></div>'
    + '<p style="font-size:0.92rem;line-height:1.5;margin:0 0 8px 0;" id="'+panelId+'-text">'+esc(cleaned)+'</p>'
    + '<div class="coach-feedback">'+renderFlagList(flags,"Reads clearly.")+'</div>'
    + '</div>';
  if(state.jobPosting.trim()){
    const r = matchKeywords();
    const notMentioned = r.missing.filter(t => !cleaned.toLowerCase().includes(t.toLowerCase())).slice(0,6);
    if(notMentioned.length){
      html += '<p class="footer-note" style="margin-top:8px;"><b>From the job posting you might naturally weave in (only if true):</b></p>';
      html += '<div class="tags-row">'+notMentioned.map(t=>'<span class="chip missing">'+esc(t)+'</span>').join("")+'</div>';
    }
  }
  html += '</div>';
  panel.innerHTML = html;
  window.__cleanedParagraph = cleaned;
}
function useCleanedParagraph(fieldKey, panelId){
  state[fieldKey] = window.__cleanedParagraph || state[fieldKey];
  persist();
  renderFormPanel();
  renderPreview();
  renderRail();
}

/* =====================================================================
   MAIN RENDER
   ===================================================================== */
function renderFormPanel(){
  const panel = document.getElementById('formPanel');
  switch(state.activeTab){
    case "contact": panel.innerHTML = renderContactTab(); break;
    case "recipient": panel.innerHTML = renderRecipientTab(); break;
    case "opening": panel.innerHTML = renderOpeningTab(); break;
    case "experience": panel.innerHTML = renderExperienceTab(); break;
    case "industry": panel.innerHTML = renderIndustryTab(); break;
    case "closing": panel.innerHTML = renderClosingTab(); break;
    case "job": panel.innerHTML = renderJobTab(); break;
    case "review": panel.innerHTML = renderReviewTab(); break;
  }
  panel.querySelectorAll('[data-coach]').forEach(el => updateCoachFeedback(el));
}
function updateCoachFeedback(el){
  const kind = el.getAttribute('data-coach');
  if(kind === "job"){
    const area = document.getElementById('jobMatchArea');
    if(area) area.innerHTML = renderJobMatch(matchKeywords());
    return;
  }
  const fb = document.getElementById(el.id + "-feedback");
  if(!fb) return;
  const opts = { checkLength:true, checkQuantify: (kind==="experience") };
  fb.innerHTML = renderFlagList(analyzeParagraph(el.value, opts), "Reads clearly.");
}
function renderAll(){
  renderRail();
  renderFormPanel();
  renderPreview();
  updateMobileWorkflow();
  document.title = state.contact.name ? (state.contact.name + " — Cover Letter") : "Cover Letter Builder & Job-Match Coach";
}

document.addEventListener('input', function(e){
  const path = e.target.getAttribute('data-path');
  if(!path) return;
  setPath(state, path, e.target.value);
  persist();
  renderPreview();
  renderRail();
  if(path === "contact.name") document.title = e.target.value ? (e.target.value + " — Cover Letter") : "Cover Letter Builder & Job-Match Coach";
  if(e.target.hasAttribute('data-coach')) updateCoachFeedback(e.target);
});

document.addEventListener('blur', function(e){
  if(e.target.getAttribute('data-path')!=="contact.phone") return;
  const formatted=formatPhoneNumber(e.target.value);
  e.target.value=formatted;
  state.contact.phone=formatted;
  persist();
  renderPreview();
  renderRail();
}, true);

/* =====================================================================
   INIT
   ===================================================================== */
(function init(){
  loadFromStorage();
  if(!state.recipient.dateStr) state.recipient.dateStr = todayFormatted();
  renderAll();
})();
</script>
</body>
</html>
